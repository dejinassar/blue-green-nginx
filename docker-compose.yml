version: "3.8"

services:
  app_blue:
    image: ${BLUE_IMAGE}
    container_name: app_blue
    ports:
      - "8081:8081"
    environment:
      - APP_POOL=blue
      - RELEASE_ID=${RELEASE_ID_BLUE}
    env_file:
      - .env
    command: ["sh", "-c", "npx http-server -p 8081 || sleep 1000"]

  app_green:
    image: ${GREEN_IMAGE}
    container_name: app_green
    ports:
      - "8082:8082"
    environment:
      - APP_POOL=green
      - RELEASE_ID=${RELEASE_ID_GREEN}
    env_file:
      - .env
    command: ["sh", "-c", "npx http-server -p 8082 || sleep 1000"]

  nginx:
    image: nginx:latest
    container_name: blue-green-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./start.sh:/start.sh:ro
    env_file:
      - .env
    depends_on:
      - app_blue
      - app_green
    restart: always
    command: ["/bin/sh", "/start.sh"]

  alert_watcher:
    build: ./watcher
    container_name: alert_watcher
    env_file:
      - .env
    volumes:
      - ./watcher:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - ./nginx.conf.template:/etc/nginx/nginx.conf.template:ro
    restart: always
